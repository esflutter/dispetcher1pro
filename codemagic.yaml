# =====================================================================
# Codemagic CI — сборка приложения ИСПОЛНИТЕЛЯ «Диспетчер №1 PRO» под iOS.
#
# Секреты В ЭТОМ ФАЙЛЕ НЕ ХРАНЯТСЯ. Перед первым запуском настрой в
# интерфейсе Codemagic (один раз):
#
#  1) Группа переменных окружения с именем  dispatcher_pro
#     (Codemagic → твоё приложение → Environment variables), все «Secure»:
#       SUPABASE_URL              = https://jokaynapesbem.beget.app
#       SUPABASE_ANON_KEY         = <полный anon-ключ из run_prod.bat>
#       DADATA_API_KEY            = <Token DaData из run_prod.bat>
#       MAPBOX_TOKEN              = <pk.… токен Mapbox из run_prod.bat>
#       GOOGLE_SERVICE_INFO_PLIST = <GoogleService-Info.plist в base64>  (как сделать — ниже)
#       CERTIFICATE_PRIVATE_KEY   = <ВСЁ содержимое файла «ios-cert-key (codemagic).pem»
#                                    из папки передачи «2. Подписи»>  ← БЕЗ НЕЁ СБОРКА ПАДАЕТ
#
#  2) Интеграция App Store Connect (Codemagic → Teams → Integrations →
#     App Store Connect): тот же .p8 API-ключ, что и у заказчика (ключ
#     один на весь Apple-аккаунт). Назови интеграцию  dispatcher_appstore.
#     Подпись iOS — ЯВНАЯ (шаги ниже): сертификат и профиль создаются через
#     App Store Connect API по приватному ключу CERTIFICATE_PRIVATE_KEY
#     (см. fetch-signing-files --certificate-key ниже).
#
#  Как получить base64 для GOOGLE_SERVICE_INFO_PLIST на Windows (PowerShell):
#    [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\путь\GoogleService-Info.plist"))
#
#  ВНИМАНИЕ: bundle id исполнителя — com.dispatcher1.pro (НЕ тот же, что у
#  заказчика). В Apple, Firebase и App Store Connect заводи именно его.
# =====================================================================

workflows:
  ios-executor:
    name: Диспетчер — исполнитель (iOS)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: dispatcher_appstore   # имя интеграции из Codemagic UI

    environment:
      groups:
        - dispatcher_pro                        # переменные окружения (см. шапку)
      vars:
        # Дубль настройки из pubspec.yaml: не переводить iOS на UIScene при сборке.
        FLUTTER_UISCENE_MIGRATION: "false"
      flutter: 3.41.7                           # как в локальной сборке
      # Xcode закреплён: пока новая схема запуска iOS (UIScene) выключена
      # (pubspec.yaml → flutter: config:), собирать на Xcode 27 нельзя — такое
      # приложение не запустится на iOS 27. «latest» переключится на 27 без спроса.
      xcode: 26.6
      cocoapods: default

    scripts:
      - name: GoogleService-Info.plist из переменной
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          test -s ios/Runner/GoogleService-Info.plist || { echo "GoogleService-Info.plist пуст — проверь переменную"; exit 1; }
      - name: Зависимости Flutter
        script: flutter pub get
      - name: CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Подпись iOS — сертификат и профиль (создаём, если их ещё нет)
        # Раньше тут был только `xcode-project use-profiles` в паре с
        # автоматическим ios_signing — но для нового bundle id профиль ещё не
        # существует, и автоподпись падала с «No matching profiles found».
        # Теперь явно: создаём дистрибуционный сертификат и App Store профиль
        # через App Store Connect API (--create), кладём в keychain и
        # применяем к Xcode-проекту. Учётные данные берутся из интеграции
        # dispatcher_appstore автоматически.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.dispatcher1.pro" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Номер сборки = последний в App Store Connect + 1
        # Спрашиваем у App Store Connect максимальный номер уже залитого билда и
        # прибавляем 1 — номер всегда уникален, править pubspec вручную не нужно.
        # APP_ID — числовой Apple ID приложения (страница «Информация о приложении»).
        # Если билдов ещё нет (новое приложение) — берём номер из pubspec как старт.
        script: |
          set -e
          APP_ID=6781102906
          LATEST=$(app-store-connect get-latest-build-number "$APP_ID" || true)
          if [ -z "$LATEST" ]; then
            LATEST=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          fi
          NEW=$((LATEST + 1))
          echo "App Store Connect: последний билд ${LATEST:-—}, собираем $NEW"
          echo "BUILD_NUMBER=$NEW" >> "$CM_ENV"
      - name: Проверка переменных сборки
        # Без адреса и ключа сервера приложение собирается «пустым» и висит на
        # белом экране. Лучше упасть здесь, чем отправить такую сборку в стор.
        script: |
          test -n "$SUPABASE_URL" || { echo "Переменная SUPABASE_URL пуста — проверь группу dispatcher_pro"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Переменная SUPABASE_ANON_KEY пуста — проверь группу dispatcher_pro"; exit 1; }
          test -n "$DADATA_API_KEY" || { echo "Переменная DADATA_API_KEY пуста — проверь группу dispatcher_pro"; exit 1; }
          test -n "$MAPBOX_TOKEN" || { echo "Переменная MAPBOX_TOKEN пуста — проверь группу dispatcher_pro"; exit 1; }
      - name: Сборка IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=DADATA_API_KEY="$DADATA_API_KEY" \
            --dart-define=MAPBOX_TOKEN="$MAPBOX_TOKEN" \
            --export-options-plist=$HOME/export_options.plist
      - name: Проверка готовой сборки
        # Не пускаем в TestFlight сборку, которая на iPhone покажет белый экран:
        # включённая новая схема запуска (UIScene) или нет адреса сервера.
        script: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP" || { echo "Не найдено собранное приложение: $APP"; exit 1; }
          if /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" "$APP/Info.plist" >/dev/null 2>&1; then
            echo "В сборке включена новая схема запуска (UIScene) — на iPhone будет белый экран. Не отправляем."
            exit 1
          fi
          HOST=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')
          if ! LC_ALL=C grep -a -q -F "$HOST" "$APP/Frameworks/App.framework/App"; then
            echo "В сборке нет адреса сервера — приложение не запустится. Не отправляем."
            exit 1
          fi
          echo "Сборка проверена: прежняя схема запуска, адрес сервера на месте."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true        # автозаливка в TestFlight после сборки
        # submit_to_app_store: false      # включишь, когда захочешь сразу на ревью
