name: dispatcher_1
description: "Диспетчер №1 — Биржа услуг спецтехники"
publish_to: 'none'
version: 1.0.1+96

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  go_router: ^17.2.2
  mask_text_input_formatter: ^2.9.0
  smooth_page_indicator: ^2.0.1
  pinput: ^6.0.2
  connectivity_plus: ^7.1.1
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  supabase_flutter: ^2.8.0
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.4.0
  # HTTP-клиент для DaData Suggest API (подсказки адресов с координатами).
  # Привязан к версии, которую и так тянет supabase_flutter транзитивно,
  # но указываем явно — это direct dep наших файлов в `lib/core/dadata/`.
  http: ^1.6.0
  # Карты на 2 экранах каталога. flutter_map — pure-Flutter map widget.
  # vector_map_tiles — рендерит векторные тайлы. Основной источник —
  # Mapbox (стиль light-v11, токен через --dart-define=MAPBOX_TOKEN);
  # без токена — запасной бесплатный OpenFreeMap (без SLA, проект одного
  # автора). Нативный Mapbox SDK НЕ используется — тайлы Mapbox идут
  # через тот же flutter_map-стек, поэтому secret-токен для сборки не нужен.
  flutter_map: ^7.0.2
  vector_map_tiles: ^8.0.0
  # Прямая зависимость нужна для типов `Theme` / `ThemeLayer` —
  # фильтруем слои стиля positron, чтобы скрыть государственные
  # границы (см. `_hideAdminBoundaries` в openfreemap_view.dart).
  # Транзитивно уже подтянута через vector_map_tiles, но без явного
  # объявления Dart-анализатор запрещает импорт.
  vector_tile_renderer: ^5.2.1
  latlong2: ^0.9.1
  # Deep links для возврата из браузерной формы YooKassa в приложение.
  # Кастомная схема `dispatcher1pro://payment/result?id=...` ловится
  # этим пакетом, и go_router сразу открывает экран статуса платежа.
  app_links: ^6.3.2
  # Путь к application cache directory — используется для дискового
  # кэша тайлов OpenFreeMap (vector_map_tiles), чтобы карта не качала
  # одни и те же тайлы при каждом открытии. Транзитивно тянется и
  # другими пакетами, но добавлен явно для соответствия линту.
  path_provider: ^2.1.4
  # Чтение версии приложения для проверки обновлений. Пин на 9.0.1 —
  # ровно та версия, что уже была в дереве транзитивно: явное добавление
  # не тянет за собой мажорные апгрейды перед самым релизом в сторы.
  package_info_plus: 9.0.1
  # Персистентное мини-хранилище: запоминаем уже обработанный deep-link,
  # чтобы после hot restart / re-launch с тем же intent'ом мы не
  # открывали повторно экран статуса оплаты.
  shared_preferences: ^2.3.0
  # Firebase Cloud Messaging — пуш-уведомления. firebase_core инициализирует
  # SDK при старте, firebase_messaging регистрирует токен устройства и
  # принимает пуши. flutter_local_notifications нужен для foreground-баннера
  # (в foreground FCM сам баннер не показывает) и для создания
  # notification-канала, без которого Android 8+ молча отбрасывает пуши.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Firebase Analytics — статистика использования для заказчика (экраны,
  # регистрации, отклики, оплаты). Без сервисов Google молча выключена.
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^17.2.3
  # Запись голоса для ИИ-ассистента. Формат OGG/Opus 16 kHz mono —
  # компактно, совместимо с Yandex SpeechKit STT v1 (sync).
  # record 5.1.2 — последняя версия, где Android/platform_interface не
  # разъезжаются по API hasPermission(recorderId). На 5.2.x record_linux
  # 0.7.2 не реализует новый сигнатур и debug-сборка падает.
  # record 5.2.1 — последняя версия (5.1.2 тоже норм). Главная проблема —
  # транзитивная record_linux 0.7.2 застряла с устаревшей сигнатурой.
  # Через overrides ниже подтягиваем свежий record_linux 1.3.1.
  record: ^5.1.2
  # Запрос разрешения на микрофон — у `record` свой ensurePermissions,
  # но он внутри использует permission_handler. Явная зависимость нужна
  # для проверки rationale + открытия настроек при denied-permanent.
  permission_handler: ^11.3.1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# record 5.1.2/5.2.1 объявляет `record_linux: ^0.7.0`, а 0.7.2 не успевает
# за новыми сигнатурами record_platform_interface (hasPermission +
# startStream). Через overrides подтягиваем актуальный record_linux 1.3.1,
# где интерфейс соответствует platform_interface 1.6.x.
dependency_overrides:
  record_linux: ^1.3.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

# Нативный splash до загрузки Flutter — намеренно ПЛЕЙН-БЕЛЫЙ, без
# логотипа. Дальше Flutter рисует `splash_screen.dart` с лого + текстом
# «Диспетчер №1 PRO» + жёлтым спиннером — единственный «правильный»
# splash, который видит пользователь. Если показать иконку и здесь —
# будет визуальный jumpcut: «голая иконка → иконка с текстом и
# спиннером», что выглядит сломанно.
# (На Android 12+ система всё равно покажет системный лаунчер-иконку
# в первый кадр — это поведение OS, отключить нельзя.)
flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/catalog/
    - assets/images/orders/
    - assets/icons/
    - assets/icons/nav/
    - assets/icons/ui/
    - assets/icons/support/
    - assets/icons/profile/
    - assets/images/profile/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
